services:
  - type: web
    name: text-to-cgan-bridge
    runtime: python
    buildCommand: pip install --upgrade pip && pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: GRADIO_ANALYTICS_ENABLED
        value: "False"
      - key: MPLCONFIGDIR
        value: /tmp
      - key: GROQ_API_KEY
        sync: false
